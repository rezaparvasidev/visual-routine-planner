appId: com.reza.visualroutineplanner
productName: Visual Routine Planner
directories:
  buildResources: build
  output: release
files:
  - out/**/*
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
